<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Nag Panchami Trilogy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Zentrale Styles -->
  <link rel="stylesheet" href="https://zidurecords.github.io/Assets/css/landing.css">

  <!-- Zentrale Scripts -->
  <script src="https://zidurecords.github.io/Assets/js/pixel.js"></script>
  <script src="https://zidurecords.github.io/Assets/js/colors.js"></script>
  <script src="https://zidurecords.github.io/Assets/js/consent.js"></script>
  <script src="https://zidurecords.github.io/Assets/js/legal.js"></script>

  <!-- Album-spezifische Variablen -->
  <script>
    const SONG_TITLE = "Nag Panchami Trilogy";
    const COVER_IMG = "NagPanchamiTrilogy.jpg";

    const SPOTIFY_LINK   = "https://open.spotify.com/intl-de/album/0TRAGa288rc3Hk6lwcAPmg";
    const APPLE_LINK     = "https://music.apple.com/de/album/100-days-to-live-single/1842874012";
    const INSTAGRAM_LINK = "https://www.instagram.com/zidu_records";
    const TIKTOK_LINK    = "https://www.tiktok.com/XXXXXXXXXXXXX";
    const PRESAVE_LINK   = "#";

    const SHOW_SPOTIFY   = true;
    const SHOW_APPLE     = false;
    const SHOW_INSTAGRAM = false;
    const SHOW_TIKTOK    = false;
    const SHOW_PRESAVE   = false;    
  </script>

  <!-- Größen -->
  <script src="https://zidurecords.github.io/Assets/js/config.js"></script>
  <!-- landing.js MUSS zuletzt kommen -->
  <script src="https://zidurecords.github.io/Assets/js/landing.js" defer></script>
</head>

<body>

  <h1 id="song-title" class="glow"></h1>

  <img id="cover-img" class="cover" alt="Album Cover">

  <div id="platforms"></div>

  <!-- CONSENT MODAL OVERLAY -->
  <div id="consent-dialog" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: 99999; backdrop-filter: blur(5px);">
    
    <!-- DAS ZENTRIERTE BANNER-FENSTER -->
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e1e1e; color: #ffffff; padding: 25px 30px; border-radius: 12px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-family: sans-serif;">
      
      <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 18px; font-weight: 600;">Privacy Settings</h3>
      
      <p style="font-size: 13px; line-height: 1.5; color: #ccc; margin-bottom: 20px;">
        We use cookies and tracking technologies (Meta, TikTok) to analyze the use of our links.
      </p>
  
      <!-- BUTTON CONTAINER -->
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button onclick="acceptConsent()" style="flex: 1; padding: 10px 16px; background-color: #1db954; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">
          Accept
        </button>
        <button onclick="declineConsent()" style="flex: 1; padding: 10px 16px; background-color: #444; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">
          Decline
        </button>
      </div>
  
    </div>
  
  </div>
</body>
</html>
